<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 424" width="760" height="424" role="img" aria-labelledby="t d" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">Players moved per shuffle</title>
<desc id="d">fewerMoves 0 (off) 50%; fewerMoves 0.1 33%; fewerMoves 0.2 27%; fewerMoves 0.3 24%; Start from current teams 19%. Fewer is better.</desc>
<rect width="760" height="424" rx="12" fill="#1a1a19"/>
<text x="24" y="36" font-size="18" font-weight="600" fill="#f0efec">Players moved per shuffle</text>
<text x="24" y="58" font-size="13" fill="#c3c2b7">Share of the server that changes team at a shuffle. Fewer is better, as long as the balance holds.</text>
<line x1="250.0" y1="84" x2="250.0" y2="354" stroke="#383835" stroke-width="1"/>
<text x="250.0" y="372" font-size="12" text-anchor="middle" fill="#c3c2b7">0%</text>
