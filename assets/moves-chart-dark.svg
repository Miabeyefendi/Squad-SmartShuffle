<text x="338.0" y="372" font-size="12" text-anchor="middle" fill="#c3c2b7">10%</text>
<line x1="426.0" y1="84" x2="426.0" y2="354" stroke="#383835" stroke-width="1"/>
<text x="426.0" y="372" font-size="12" text-anchor="middle" fill="#c3c2b7">20%</text>
<line x1="514.0" y1="84" x2="514.0" y2="354" stroke="#383835" stroke-width="1"/>
<text x="514.0" y="372" font-size="12" text-anchor="middle" fill="#c3c2b7">30%</text>
<line x1="602.0" y1="84" x2="602.0" y2="354" stroke="#383835" stroke-width="1"/>
<text x="602.0" y="372" font-size="12" text-anchor="middle" fill="#c3c2b7">40%</text>
<line x1="690.0" y1="84" x2="690.0" y2="354" stroke="#383835" stroke-width="1"/>
<text x="690.0" y="372" font-size="12" text-anchor="middle" fill="#c3c2b7">50%</text>
<text x="236" y="105" font-size="14" font-weight="400" text-anchor="end" fill="#f0efec">fewerMoves 0 (off)</text>
<text x="236" y="121" font-size="11.5" text-anchor="end" fill="#c3c2b7">same as 1.1.0</text>
<path d="M250 96 h436.0 a4 4 0 0 1 4 4 v14 a4 4 0 0 1 -4 4 h-436.0 z" fill="#77766f"/>
<text x="698.0" y="112" font-size="14" font-weight="600" fill="#f0efec">50%</text>
