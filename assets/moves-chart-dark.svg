<text x="548.4" y="166" font-size="14" font-weight="600" fill="#f0efec">33%</text>
<text x="236" y="213" font-size="14" font-weight="400" text-anchor="end" fill="#f0efec">fewerMoves 0.2</text>
<text x="236" y="229" font-size="11.5" text-anchor="end" fill="#c3c2b7">stomps about +0.5 points</text>
<path d="M250 204 h233.6 a4 4 0 0 1 4 4 v14 a4 4 0 0 1 -4 4 h-233.6 z" fill="#77766f"/>
<text x="495.6" y="220" font-size="14" font-weight="600" fill="#f0efec">27%</text>
