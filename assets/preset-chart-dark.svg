<title id="t">Stomped matches by preset, best first</title>
<desc id="d">1. quality-max 10.6%; 2. quality-session 10.7%; 3. quality-fresh 10.7%; 4. friends-small 11.1%; No preset 11.2%; 5. friends-squad 11.5%; Random shuffle 29.2%. Lower is better.</desc>
