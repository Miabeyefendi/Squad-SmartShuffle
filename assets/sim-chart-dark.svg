<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 370" width="760" height="370" role="img" aria-labelledby="t d" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">Stomped matches in simulation, by shuffle method</title>
<desc id="d">Random shuffle 26.6%; All-time stats only 12.6%; This match only 10.3%; This match + session rounds 9.5%. Lower is better.</desc>
<rect width="760" height="370" rx="12" fill="#1a1a19"/>
<text x="24" y="36" font-size="18" font-weight="600" fill="#f0efec">Stomped matches in simulation</text>
<text x="24" y="58" font-size="13" fill="#c3c2b7">Share of matches that end with a gap over 150 tickets. Lower is better.</text>
<line x1="250.0" y1="84" x2="250.0" y2="300" stroke="#383835" stroke-width="1"/>
<text x="250.0" y="318" font-size="12" text-anchor="middle" fill="#c3c2b7">0%</text>
<line x1="396.7" y1="84" x2="396.7" y2="300" stroke="#383835" stroke-width="1"/>
<text x="396.7" y="318" font-size="12" text-anchor="middle" fill="#c3c2b7">10%</text>
<line x1="543.3" y1="84" x2="543.3" y2="300" stroke="#383835" stroke-width="1"/>
<text x="543.3" y="318" font-size="12" text-anchor="middle" fill="#c3c2b7">20%</text>
<line x1="690.0" y1="84" x2="690.0" y2="300" stroke="#383835" stroke-width="1"/>
<text x="690.0" y="318" font-size="12" text-anchor="middle" fill="#c3c2b7">30%</text>
<text x="236" y="105" font-size="14" font-weight="400" text-anchor="end" fill="#f0efec">Random shuffle</text>
<text x="236" y="121" font-size="11.5" text-anchor="end" fill="#c3c2b7">what the stock randomizer does</text>
<path d="M250 96 h386.1 a4 4 0 0 1 4 4 v14 a4 4 0 0 1 -4 4 h-386.1 z" fill="#77766f"/>
<text x="648.1" y="112" font-size="14" font-weight="600" fill="#f0efec">26.6%</text>
<text x="236" y="159" font-size="14" font-weight="400" text-anchor="end" fill="#f0efec">All-time stats only</text>
<text x="236" y="175" font-size="11.5" text-anchor="end" fill="#c3c2b7">rating from career totals, this match ignored</text>
<path d="M250 150 h180.8 a4 4 0 0 1 4 4 v14 a4 4 0 0 1 -4 4 h-180.8 z" fill="#77766f"/>
<text x="442.8" y="166" font-size="14" font-weight="600" fill="#f0efec">12.6%</text>
<text x="236" y="213" font-size="14" font-weight="400" text-anchor="end" fill="#f0efec">This match only</text>
<text x="236" y="229" font-size="11.5" text-anchor="end" fill="#c3c2b7">the 1.0 formula</text>
<path d="M250 204 h147.1 a4 4 0 0 1 4 4 v14 a4 4 0 0 1 -4 4 h-147.1 z" fill="#77766f"/>
<text x="409.1" y="220" font-size="14" font-weight="600" fill="#f0efec">10.3%</text>
<text x="236" y="267" font-size="14" font-weight="600" text-anchor="end" fill="#f0efec">This match + session rounds</text>
<text x="236" y="283" font-size="11.5" text-anchor="end" fill="#c3c2b7">default since 1.1</text>
<path d="M250 258 h135.3 a4 4 0 0 1 4 4 v14 a4 4 0 0 1 -4 4 h-135.3 z" fill="#3987e5"/>
<text x="397.3" y="274" font-size="14" font-weight="600" fill="#f0efec">9.5%</text>
<text x="24" y="354" font-size="11.5" fill="#c3c2b7">43,200 simulated matches per method (24 seeds x 300 lineups x 6 replays), 100 players each. A model, not live server data.</text>
</svg>
