<text x="196" y="426" font-size="11.5" text-anchor="end" fill="#c3c2b7">no plugin</text>
<text x="24" y="490" font-size="11.5" fill="#c3c2b7">Average of three simulated worlds, 21,600 matches per row, 100 players, parties start together. Presets 2.0.0. A model, not live data.</text>
