<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 506" width="760" height="506" role="img" aria-labelledby="t d" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">Preset ladder: balance against players moved</title>
<desc id="d">1. strict: 10.7% stomped, 33% moved; No preset: 11.5% stomped, 50% moved; 2. balanced: 14.1% stomped, 13% moved; 3. relaxed: 18.2% stomped, 10% moved; 4. together: 21.8% stomped, 9% moved; 5. light: 23.9% stomped, 8% moved; Random shuffle: 29.3% stomped, 50% moved</desc>
