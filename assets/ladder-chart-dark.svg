<text x="24" y="36" font-size="18" font-weight="600" fill="#f0efec">Preset ladder: each step moves fewer players</text>
<text x="24" y="58" font-size="13" fill="#c3c2b7">More players stay on their team and more parties stay whole, for more stomped matches.</text>
<text x="214.0" y="88" font-size="13" font-weight="600" fill="#f0efec">Stomped matches (lower = more even)</text>
