<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 370" width="760" height="370" role="img" aria-labelledby="t d" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">Stomped matches in simulation, by shuffle method</title>
<desc id="d">Random shuffle 26.6%; All-time stats only 12.6%; This match only 10.3%; This match + session rounds 9.5%. Lower is better.</desc>
<rect width="760" height="370" rx="12" fill="#fcfcfb"/>
<text x="24" y="36" font-size="18" font-weight="600" fill="#0b0b0b">Stomped matches in simulation</text>
<text x="24" y="58" font-size="13" fill="#52514e">Share of matches that end with a gap over 150 tickets. Lower is better.</text>
<line x1="250.0" y1="84" x2="250.0" y2="300" stroke="#e4e3de" stroke-width="1"/>
<text x="250.0" y="318" font-size="12" text-anchor="middle" fill="#52514e">0%</text>
<line x1="396.7" y1="84" x2="396.7" y2="300" stroke="#e4e3de" stroke-width="1"/>
<text x="396.7" y="318" font-size="12" text-anchor="middle" fill="#52514e">10%</text>
<line x1="543.3" y1="84" x2="543.3" y2="300" stroke="#e4e3de" stroke-width="1"/>
<text x="543.3" y="318" font-size="12" text-anchor="middle" fill="#52514e">20%</text>
<line x1="690.0" y1="84" x2="690.0" y2="300" stroke="#e4e3de" stroke-width="1"/>
<text x="690.0" y="318" font-size="12" text-anchor="middle" fill="#52514e">30%</text>
<text x="236" y="105" font-size="14" font-weight="400" text-anchor="end" fill="#0b0b0b">Random shuffle</text>
<text x="236" y="121" font-size="11.5" text-anchor="end" fill="#52514e">what the stock randomizer does</text>
<path d="M250 96 h386.1 a4 4 0 0 1 4 4 v14 a4 4 0 0 1 -4 4 h-386.1 z" fill="#8c8b84"/>
<text x="648.1" y="112" font-size="14" font-weight="600" fill="#0b0b0b">26.6%</text>
<text x="236" y="159" font-size="14" font-weight="400" text-anchor="end" fill="#0b0b0b">All-time stats only</text>
<text x="236" y="175" font-size="11.5" text-anchor="end" fill="#52514e">rating from career totals, this match ignored</text>
<path d="M250 150 h180.8 a4 4 0 0 1 4 4 v14 a4 4 0 0 1 -4 4 h-180.8 z" fill="#8c8b84"/>
<text x="442.8" y="166" font-size="14" font-weight="600" fill="#0b0b0b">12.6%</text>
<text x="236" y="213" font-size="14" font-weight="400" text-anchor="end" fill="#0b0b0b">This match only</text>
<text x="236" y="229" font-size="11.5" text-anchor="end" fill="#52514e">the 1.0 formula</text>
<path d="M250 204 h147.1 a4 4 0 0 1 4 4 v14 a4 4 0 0 1 -4 4 h-147.1 z" fill="#8c8b84"/>
<text x="409.1" y="220" font-size="14" font-weight="600" fill="#0b0b0b">10.3%</text>
<text x="236" y="267" font-size="14" font-weight="600" text-anchor="end" fill="#0b0b0b">This match + session rounds</text>
<text x="236" y="283" font-size="11.5" text-anchor="end" fill="#52514e">default since 1.1</text>
<path d="M250 258 h135.3 a4 4 0 0 1 4 4 v14 a4 4 0 0 1 -4 4 h-135.3 z" fill="#2a78d6"/>
<text x="397.3" y="274" font-size="14" font-weight="600" fill="#0b0b0b">9.5%</text>
<text x="24" y="354" font-size="11.5" fill="#52514e">43,200 simulated matches per method (24 seeds x 300 lineups x 6 replays), 100 players each. A model, not live server data.</text>
</svg>
