# Removes the "blank issue" escape hatch, so every report goes through a form.
blank_issues_enabled: false
contact_links:
  - name: Security vulnerability
    url: https://github.com/Miabeyefendi/Squad-SmartShuffle/security/advisories/new
    about: Never report a vulnerability in a public issue. Use a private advisory.
  - name: Question or idea
    url: https://github.com/Miabeyefendi/Squad-SmartShuffle/discussions
    about: For usage questions and open-ended ideas, start a discussion instead.
  - name: Read the README first
    url: https://github.com/Miabeyefendi/Squad-SmartShuffle/blob/main/README.md#%EF%B8%8F-configuration
    about: Installation, commands and every setting are documented there.
